services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UID: 1000 
        GID: 1000
    container_name: nextcloud_app
    ports:
      - 8080:80
    links:
      - db
    volumes:
      - ./app:/var/www/html
    restart: no
    environment:
      NC_TRUSTED_DOMAIN: localhost
      #NC_dbhost: db
      #NC_dbname: nextcloud
      #NC_dbuser: nextcloud
      #NC_dbpassword: password
      #NC_instanceid: OucjtW2QNxJ3MCVs
      #NC_passwordsalt: zgg+DTZA26HEA8qL7a+b7wNx9WHzVaPl4VAnbzhx24o=
      #NC_secret: +KyDr+VYxumAIfRmnMW47LUEL9K3XZ9XGe1xHmINCMhMmU5gv/Yqjwu4r2Gu2xnvyTPAW2Lkm8WwXPQZi3hqg==
      #NC_datadirectory: '/var/www/html/data'
      NC_loglevel: 0
      NC_debug: true
    depends_on:
      - db
  db:
    image: mariadb:10.6.18
    container_name: nextcloud_db
    restart: no
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: password
    volumes:
      - db:/var/lib/mysql
volumes:
  db:
